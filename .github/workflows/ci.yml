name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # CGO is off (pure-Go SQLite), so cross-compiling needs no toolchain.
      - name: Cross compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" \
              -o "dist/cinevote-$os-$arch" ./cmd/cinevote
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pull requests from forks cannot push, so they only build.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the zero-configuration path: no env file, no API key, no volume.
      - name: Smoke test the image in demo mode
        run: |
          docker build -t cinevote:smoke .
          docker run -d --name cinevote-smoke -p 8080:8080 \
            -e CINEVOTE_DB= cinevote:smoke -demo
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz | grep -q ok; then
              echo "healthy after ${i}s"
              curl -fsS -o /dev/null -w 'login page: %{http_code}\n' http://localhost:8080/login
              # The demo must arrive seeded and advertise its own logins.
              curl -fsS http://localhost:8080/login | grep -q 'Demokonton' \
                || { echo "demo logins missing from the login page"; exit 1; }
              docker logs cinevote-smoke | grep -q 'demo data created' \
                || { echo "demo data was not seeded"; exit 1; }
              docker logs cinevote-smoke
              docker rm -f cinevote-smoke
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs cinevote-smoke
          exit 1
